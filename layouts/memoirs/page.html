{{ define "main" }}
<div class="prose">
  <header class="entry-header"><h1>{{ .Title }}</h1></header>
  <div class="entry-content">{{ .Content }}</div>
  {{ partial "subscribe.html" . }}
  {{ $memoirs := where site.RegularPages "Params.categories" "intersect" (slice "memoirs") }}
  {{ partial "post-list.html" $memoirs.ByDate.Reverse }}
  {{ with .Params.note }}<p class="note"><em>{{ . }}</em></p>{{ end }}
</div>
{{ end }}
