<ol class="post-list">
  {{ range . }}
  <li>
    <a class="post-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
    <p class="excerpt">{{ .Summary | plainify | truncate 140 }}</p>
  </li>
  {{ end }}
</ol>
