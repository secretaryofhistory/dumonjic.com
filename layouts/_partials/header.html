{{ $p := .RelPermalink }}
{{ $home := .IsHome }}
{{ $hasFeatured := gt (len (where (where site.RegularPages "Section" "work") "Params.featured" true)) 0 }}
<header class="site-header">
  <a class="site-title" href="/" {{ if .IsHome }}aria-current="page"{{ end }}>Alen Dumonjić</a>
  <nav class="site-nav" aria-label="Main">
    <a href="{{ cond (and $home $hasFeatured) "#work" "/work/" }}"{{ if hasPrefix $p "/work/" }} aria-current="page"{{ end }}>Work</a>
    <a href="{{ cond $home "#writing" "/creative-writing/" }}"{{ if or (eq $p "/creative-writing/") (eq $p "/memoirs-beyond-the-womb/") }} aria-current="page"{{ end }}>Writing</a>
    <a href="{{ cond $home "#about" "/about/" }}"{{ if eq $p "/about/" }} aria-current="page"{{ end }}>About</a>
    <a href="/search/" class="nav-search" aria-label="Search"{{ if eq $p "/search/" }} aria-current="page"{{ end }}>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="nav-search-label">Search</span>
    </a>
  </nav>
</header>
