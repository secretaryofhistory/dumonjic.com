{{ define "main" }}
<div class="prose">
  <header class="entry-header"><h1>{{ .Title }}</h1></header>
  <div class="entry-content">{{ .Content }}</div>
  <p class="cta cta--left">
    {{ with site.Params.contact_email }}<a class="btn" href="mailto:{{ . }}">{{ . }}</a>{{ end }}
    <a class="btn{{ if site.Params.contact_email }} btn--ghost{{ end }}" href="{{ site.Params.linkedin }}">Message me on LinkedIn</a>
  </p>
</div>
{{ end }}
